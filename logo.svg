<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90d9"/>
      <stop offset="100%" style="stop-color:#2c6fad"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e8f0fe"/>
    </linearGradient>
  </defs>
  
  <!-- 圆角方形背景 -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bgGrad)"/>
  
  <!-- 云朵形状（博思云） -->
  <ellipse cx="256" cy="220" rx="90" ry="65" fill="url(#cloudGrad)" opacity="0.95"/>
  <ellipse cx="200" cy="235" rx="60" ry="50" fill="url(#cloudGrad)" opacity="0.95"/>
  <ellipse cx="312" cy="235" rx="60" ry="50" fill="url(#cloudGrad)" opacity="0.95"/>
  <ellipse cx="256" cy="250" rx="100" ry="50" fill="url(#cloudGrad)" opacity="0.95"/>
  
  <!-- 纸飞机（Telegram 标志性元素） -->
  <g transform="translate(220, 185) scale(0.9)">
    <polygon points="10,40 80,20 50,55" fill="#4a90d9"/>
    <polygon points="80,20 50,55 55,75 65,50" fill="#3a7bc8"/>
    <polygon points="10,40 50,55 45,70" fill="#2c6fad"/>
  </g>
  
  <!-- 对话气泡（自动回复） -->
  <rect x="150" y="300" width="212" height="80" rx="20" ry="20" fill="#ffffff" opacity="0.95"/>
  <!-- 气泡尖角 -->
  <polygon points="200,300 220,280 240,300" fill="#ffffff" opacity="0.95"/>
  
  <!-- 气泡内的三条线（代表文字/分条回复） -->
  <rect x="175" y="322" width="120" height="8" rx="4" fill="#4a90d9" opacity="0.6"/>
  <rect x="175" y="340" width="90" height="8" rx="4" fill="#4a90d9" opacity="0.4"/>
  <rect x="175" y="358" width="105" height="8" rx="4" fill="#4a90d9" opacity="0.3"/>
  
  <!-- 闪电/自动化标志 -->
  <g transform="translate(320, 310)">
    <polygon points="20,0 8,28 22,28 12,50 35,20 22,20 30,0" fill="#f5a623" stroke="none"/>
  </g>
  
  <!-- 底部文字 "BC" (BosiCloud 缩写) -->
  <text x="256" y="440" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" opacity="0.9">BosiCloud</text>
</svg>
